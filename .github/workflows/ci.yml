name: .NET CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore ./ConsulationAppBackend/ConsulationApllication.sln

    - name: Build solution
      run: dotnet build ./ConsulationAppBackend/ConsulationApllication.sln --no-restore --configuration Release

  test:
    runs-on: ubuntu-latest
    needs: build

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Run tests
      run: dotnet test ./ConsulationAppBackend/TestConsultationApplication.Tests/TestConsultationApplication.Tests.csproj --configuration Release
  build-and-push:
    runs-on: ubuntu-latest
    needs: build

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Login to Docker Hub
      run: echo "${{ secrets.DOCKERHUB_PASSWORD }}" | docker login -u "${{ secrets.DOCKERHUB_USER_NAME }}" --password-stdin

    - name: Build Docker image
      env:
        DOCKERFILE_PATH: ./ConsulationAppBackend/ConsulationApplication/Dockerfile
      run: docker build -t qhawe911/lwazi:latest -f $DOCKERFILE_PATH .

    - name: Push Docker image
      run: docker push qhawe911/lwazi:latest
