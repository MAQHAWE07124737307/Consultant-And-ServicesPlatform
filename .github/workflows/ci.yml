name: .NET CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore ./ConsulationAppBackend/ConsulationApllication.sln

    - name: Build solution
      run: dotnet build ./ConsulationAppBackend/ConsulationApllication.sln --no-restore --configuration Release

  test:
    runs-on: ubuntu-latest
    needs: build

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Run tests
      run: dotnet test ./ConsulationAppBackend/TestConsultationApplication.Tests/TestConsultationApplication.Tests.csproj --configuration Release
      
    
  sast:
    name: SAST (CodeQL)
    runs-on: ubuntu-latest
    needs: [build, test]
    permissions:
      security-events: write
      contents: read
      actions: read

    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: csharp

      - uses: github/codeql-action/autobuild@v3

      - uses: github/codeql-action/analyze@v3


  dependency-scan:
    name: Dependency Scan (Trivy FS)
    runs-on: ubuntu-latest
    needs: [build, test]

    steps:
      - uses: actions/checkout@v4

      - uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          format: table
          severity: HIGH,CRITICAL


  secret-scan:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    needs: [build, test]

    steps:
      - uses: actions/checkout@v4

      - uses: gitleaks/gitleaks-action@v2


  container-scan:
    name: Container Scan (Trivy)
    runs-on: ubuntu-latest
    needs: [build, test]

    steps:
      - uses: actions/checkout@v4

      - run: docker build -t myapp:latest ./ConsulationAppBackend/ConsulationApllication

      - uses: aquasecurity/trivy-action@master
        with:
          image-ref: myapp:latest
          format: table
          severity: HIGH,CRITICAL
  
  build-and-push:
    runs-on: ubuntu-latest
    needs: [build, test]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Login to Docker Hub
      run: echo "${{ secrets.DOCKERHUB_PASSWORD }}" | docker login -u "${{ secrets.DOCKERHUB_USER_NAME }}" --password-stdin

    - name: Build Docker image
      
      run: |
       cd ./ConsulationAppBackend/ConsulationApllication
       docker build -t qhawe911/lwazi:latest -f Dockerfile .

    - name: Push Docker image
      run: docker push qhawe911/lwazi:latest
